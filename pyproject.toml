[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaif-file-organizer"
version = "0.1.0"
description = "A safe, general-purpose local file organizer and file-management CLI."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
    { name = "Mohd Kaif Ansari" }
]

keywords = [
    "file-organizer",
    "file-management",
    "automation",
    "cli",
    "python",
    "productivity"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities"
]

dependencies = []

[project.urls]
Homepage = "https://github.com/techykaif/file-organizer"
Repository = "https://github.com/techykaif/file-organizer"
Issues = "https://github.com/techykaif/file-organizer/issues"

[project.scripts]
file-organizer = "file_organizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]