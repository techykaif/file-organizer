[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kaif-file-organizer"
version = "0.1.3"
description = "A safe, general-purpose local file organizer and file-management CLI."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Kaif-Source-Available"
license-files = ["LICENSE"]

authors = [
    { name = "Mohd Kaif Ansari" }
]

keywords = [
    "file-organizer",
    "file-management",
    "automation",
    "cli",
    "python",
    "productivity"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities"
]

dependencies = []

[project.urls]
Homepage = "https://github.com/techykaif/file-organizer"
Repository = "https://github.com/techykaif/file-organizer"
Issues = "https://github.com/techykaif/file-organizer/issues"

[project.scripts]
file-organizer = "file_organizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
