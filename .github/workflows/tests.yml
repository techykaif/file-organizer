name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip build
        pip install ".[dev]"

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Test with pytest
      run: |
        pytest --cov=file_organizer tests/

    - name: Build package
      run: |
        python -m build

    - name: Validate Wheel Installation
      run: |
        python -m venv wheel-venv
        WHEEL_PATH=$(ls dist/*.whl)
        wheel-venv/bin/pip install "$WHEEL_PATH"
        wheel-venv/bin/file-organizer --version
        wheel-venv/bin/file-organizer --help
        rm -rf wheel-venv
