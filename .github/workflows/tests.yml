name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: "0.12.6"
        enable-cache: true

    - name: Install locked dependencies
      run: |
        uv sync --locked --extra dev

    - name: Lint with Ruff
      run: |
        uv run --locked ruff check .

    - name: Check Ruff formatting
      run: |
        uv run --locked ruff format --check .

    - name: Type check with Pyright
      run: |
        uvx --from pyright==1.1.411 pyright

    - name: Test with pytest
      run: |
        uv run --locked pytest --cov=file_organizer --cov-report=term-missing --cov-fail-under=85 tests/

    - name: Build package
      run: |
        uv build

    - name: Validate Wheel Installation
      run: |
        python -m venv wheel-venv
        WHEEL_PATH=$(ls dist/*.whl)
        wheel-venv/bin/pip install "$WHEEL_PATH"
        wheel-venv/bin/file-organizer --version
        wheel-venv/bin/file-organizer --help
        rm -rf wheel-venv

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"
        pip install pip-audit

    - name: Audit dependencies
      run: |
        pip-audit
