name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.6"
        enable-cache: true

    - name: Install locked dependencies
      run: |
        uv sync --locked --extra dev

    - name: Lint with Ruff
      run: |
        uv run --locked ruff check .

    - name: Check Ruff formatting
      run: |
        uv run --locked ruff format --check .

    - name: Type check with Pyright
      run: |
        uvx --from pyright==1.1.411 pyright

    - name: Test with pytest
      run: |
        uv run --locked pytest --cov=file_organizer --cov-report=term-missing --cov-fail-under=85 tests/

    - name: Build package
      run: |
        uv build

    - name: Validate Wheel Installation
      shell: bash
      run: |
        python -m venv wheel-venv
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          WHEEL_PATH=$(ls dist/*.whl)
          wheel-venv/Scripts/pip install "$WHEEL_PATH"
          wheel-venv/Scripts/file-organizer --version
          wheel-venv/Scripts/file-organizer --help
        else
          WHEEL_PATH=$(ls dist/*.whl)
          wheel-venv/bin/pip install "$WHEEL_PATH"
          wheel-venv/bin/file-organizer --version
          wheel-venv/bin/file-organizer --help
        fi
        rm -rf wheel-venv

  fresh-clone:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.6"

    - name: Clone repository into a clean directory
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REF="${GITHUB_HEAD_REF:-main}"
        git clone --depth 1 --branch "$REF" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" fresh-clone

    - name: Install from committed lockfile
      working-directory: fresh-clone
      run: |
        uv sync --locked --extra dev

    - name: Run documented verification commands
      working-directory: fresh-clone
      run: |
        uv run --locked ruff check .
        uv run --locked ruff format --check .
        uvx --from pyright==1.1.411 pyright
        uv run --locked pytest --cov=file_organizer --cov-fail-under=85 tests/
        uv build

    - name: Verify built wheel
      working-directory: fresh-clone
      run: |
        python -m venv wheel-venv
        WHEEL_PATH=$(ls dist/*.whl)
        wheel-venv/bin/pip install "$WHEEL_PATH"
        wheel-venv/bin/file-organizer --version
        wheel-venv/bin/file-organizer --help
        rm -rf wheel-venv

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.6"

    - name: Install locked dependencies
      run: |
        uv sync --locked --extra dev
        uv pip install --python .venv/bin/python pip-audit

    - name: Audit dependencies
      run: |
        uv run --locked pip-audit
